name: replypilot
description: ReplyPilot AI - reply drafts, orders and follow-ups for Facebook sellers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1   # stay on 2.x: this code uses the 2.x Notifier API
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/img.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFE7B5"
  adaptive_icon_foreground: "assets/images/img.png"
